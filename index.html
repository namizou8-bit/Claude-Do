<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予定表</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; background: #f2f4f7; color: #1a1a2e; padding: 16px; line-height: 1.6; }
  .container { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; text-align: center; color: #16324f; margin-bottom: 6px; }
  .sync-status { text-align: center; font-size: 12px; margin-bottom: 14px; }
  .sync-status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .sync-on { color: #2f8f57; } .sync-on .dot { background: #2f8f57; }
  .sync-off { color: #b58a2e; } .sync-off .dot { background: #d9a52e; }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; -webkit-overflow-scrolling: touch; align-items: center; }
  .tab { flex: 0 0 auto; padding: 10px 16px; border: none; border-radius: 10px; background: #e2e8f0; color: #44556a; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
  .tab.active { background: #16324f; color: #fff; box-shadow: 0 2px 8px rgba(22,50,79,0.25); }
  .tab-add { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 10px; border: 2px dashed #b6c2d1; background: transparent; color: #7089a3; font-size: 20px; cursor: pointer; }

  .panel { background: #fff; border-radius: 14px; padding: 14px 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .panel-head .day-name { font-size: 15px; font-weight: 700; color: #16324f; }
  .panel-head .day-actions button { border: none; background: transparent; color: #94a3b8; font-size: 13px; cursor: pointer; padding: 4px 6px; }

  .item { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #eef1f5; }
  .item:last-child { border-bottom: none; }
  .label { flex: 0 0 70px; font-size: 14px; font-weight: 700; color: #2563a6; font-variant-numeric: tabular-nums; word-break: break-word; }
  .label.plain { color: #94a3b8; font-weight: 600; }
  .content { flex: 1; font-size: 15px; word-break: break-word; }
  .row-actions { display: flex; gap: 2px; }
  .row-actions button { border: none; background: transparent; cursor: pointer; font-size: 15px; color: #b6c0cc; padding: 4px 5px; border-radius: 6px; }
  .row-actions button:hover { background: #f0f3f7; }

  .add-item { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .add-item input { padding: 9px 11px; border: 1px solid #d7dee7; border-radius: 9px; font-size: 14px; font-family: inherit; }
  .add-item input.label-in { flex: 0 0 90px; }
  .add-item input.content-in { flex: 1; min-width: 120px; }
  .add-item button { padding: 9px 16px; border: none; border-radius: 9px; background: #16324f; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }

  .toolbar { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 18px; }
  .toolbar button { padding: 14px 12px; border: 1px solid #d7dee7; border-radius: 12px; background: #fff; color: #2b3a4a; font-size: 15px; font-weight: 600; cursor: pointer; min-height: 52px; }
  .toolbar button:active { background: #eef2f6; }
  .hint { text-align: center; color: #9aa7b5; font-size: 12px; margin-top: 10px; }

  .overlay { position: fixed; inset: 0; background: rgba(20,30,45,0.45); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 20px; width: 100%; max-width: 360px; }
  .modal h3 { font-size: 16px; margin-bottom: 14px; color: #16324f; }
  .modal label { display: block; font-size: 12px; color: #7089a3; margin: 10px 0 4px; }
  .modal input { width: 100%; padding: 10px 12px; border: 1px solid #d7dee7; border-radius: 9px; font-size: 15px; font-family: inherit; }
  .modal .modal-btns { display: flex; gap: 8px; margin-top: 18px; }
  .modal .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .modal .save-btn { background: #16324f; color: #fff; }
  .modal .cancel-btn { background: #eef1f5; color: #556; }
  .modal .danger-btn { background: #c0392b; color: #fff; }

  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: #16324f; color: #fff; padding: 13px 22px; border-radius: 999px; font-size: 15px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.25); opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 100; max-width: 90%; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #gate { position: fixed; inset: 0; background: #f2f4f7; display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  #gate.hidden { display: none; }
  .gate-card { background: #fff; border-radius: 14px; padding: 28px 22px; width: 100%; max-width: 320px; box-shadow: 0 2px 14px rgba(0,0,0,0.08); text-align: center; }
  .gate-card h2 { font-size: 18px; color: #16324f; margin-bottom: 16px; }
  .gate-card input { width: 100%; padding: 12px; border: 1px solid #d7dee7; border-radius: 10px; font-size: 16px; text-align: center; font-family: inherit; }
  .gate-card button { margin-top: 14px; width: 100%; padding: 12px; border: none; border-radius: 10px; background: #16324f; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
  .gate-err { color: #c0392b; font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <h2>🔒 合言葉を入力</h2>
    <input type="password" id="gateInput" placeholder="合言葉" autocomplete="off" autocapitalize="off">
    <div class="gate-err" id="gateErr"></div>
    <button id="gateBtn">開く</button>
  </div>
</div>

<script>
(function () {
  var PASS = 'do';
  var KEY = 'schedule-unlocked';
  function unlock() { var g = document.getElementById('gate'); if (g) g.classList.add('hidden'); }
  document.addEventListener('DOMContentLoaded', function () {
    try { if (localStorage.getItem(KEY) === '1') { unlock(); return; } } catch (e) {}
    var input = document.getElementById('gateInput');
    var btn = document.getElementById('gateBtn');
    var err = document.getElementById('gateErr');
    function tryUnlock() {
      if (input.value === PASS) {
        try { localStorage.setItem(KEY, '1'); } catch (e) {}
        unlock();
      } else {
        err.textContent = '合言葉が違います';
        input.value = '';
      }
    }
    btn.addEventListener('click', tryUnlock);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });
    setTimeout(function () { input.focus(); }, 100);
  });
})();
</script>

<div class="container">
  <h1>📅 予定表</h1>
  <div class="sync-status" id="syncStatus"><span class="dot"></span><span id="syncText">接続中…</span></div>
  <div class="tabs" id="tabs"></div>
  <div id="panelArea"></div>
  <div class="toolbar">
    <button onclick="resetData()">初期化</button>
  </div>
  <p class="hint">編集は自動でクラウドに保存され、すべての端末に自動で反映されます。上部が緑「同期中」なら正常です。</p>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>項目を編集</h3>
    <label>ラベル（時刻や「未定」など）</label>
    <input type="text" id="editLabel" placeholder="例: 15:00 / 未定">
    <label>内容</label>
    <input type="text" id="editContent" placeholder="例: ⛳️ Golf">
    <div class="modal-btns">
      <button class="cancel-btn" onclick="closeModal()">キャンセル</button>
      <button class="save-btn" onclick="saveModal()">保存</button>
    </div>
  </div>
</div>

<div class="overlay" id="promptOverlay">
  <div class="modal">
    <h3 id="promptTitle">入力</h3>
    <label id="promptLabel">名前</label>
    <input type="text" id="promptInput">
    <div class="modal-btns">
      <button class="cancel-btn" onclick="closePrompt()">キャンセル</button>
      <button class="save-btn" id="promptOk">OK</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="modal">
    <h3 id="confirmTitle">確認</h3>
    <div class="modal-btns">
      <button class="cancel-btn" onclick="closeConfirm()">キャンセル</button>
      <button class="danger-btn" id="confirmOk">実行</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC-GCCTBDDImWb1IOEvRP52NkfVMb6iYHM",
    authDomain: "claude-do-14749.firebaseapp.com",
    databaseURL: "https://claude-do-14749-default-rtdb.firebaseio.com",
    projectId: "claude-do-14749",
    storageBucket: "claude-do-14749.firebasestorage.app",
    messagingSenderId: "44951672939",
    appId: "1:44951672939:web:2d628161affbb6a8e3b92e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dataRef = ref(db, 'schedule');

  const seedData = {
    activeTab: 0,
    tabs: [
      { name: '土日', items: [
        { label: '8:01', content: '🚄 10:45' },
        { label: '13:30', content: '💇 散髪' },
        { label: '15:00', content: '⛳️ Golf' },
        { label: '日 10:15', content: '🌞 湘南' },
        { label: '予定', content: '💪 gym' },
        { label: '予定', content: '琥珀 ➡ ✉' },
        { label: '未定', content: 'サウナ' },
        { label: '未定', content: 'ストレッチ' },
        { label: '未定', content: 'nene ➡ ✉' }
      ]}
    ]
  };

  let data = JSON.parse(JSON.stringify(seedData));
  let firstLoad = true;

  function save() {
    set(dataRef, data).catch(() => toast('保存できませんでした'));
  }

  // realtime sync: reflect remote changes automatically
  onValue(dataRef, (snap) => {
    const remote = snap.val();
    if (remote && Array.isArray(remote.tabs)) {
      if (JSON.stringify(remote) === JSON.stringify(data) && !firstLoad) return;
      data = remote;
      if (typeof data.activeTab !== 'number') data.activeTab = 0;
      render();
    } else if (firstLoad) {
      // no data in cloud yet: seed it
      save();
      render();
    }
    firstLoad = false;
  }, () => { toast('読み込みに失敗しました'); });

  // connection status
  const connRef = ref(db, '.info/connected');
  onValue(connRef, (snap) => {
    const el = document.getElementById('syncStatus');
    const txt = document.getElementById('syncText');
    if (snap.val() === true) { el.className = 'sync-status sync-on'; txt.textContent = '同期中（全端末で自動反映）'; }
    else { el.className = 'sync-status sync-off'; txt.textContent = 'オフライン（接続待ち）'; }
  });

  // ---- in-page dialogs ----
  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }
  function showPrompt(title, labelText, initial) {
    return new Promise(resolve => {
      document.getElementById('promptTitle').textContent = title;
      document.getElementById('promptLabel').textContent = labelText;
      const input = document.getElementById('promptInput');
      input.value = initial || '';
      const ov = document.getElementById('promptOverlay');
      ov.classList.add('show');
      setTimeout(() => input.focus(), 50);
      const ok = document.getElementById('promptOk');
      const done = (val) => { ov.classList.remove('show'); ok.onclick = null; input.onkeydown = null; resolve(val); };
      ok.onclick = () => done(input.value.trim());
      input.onkeydown = (e) => { if (e.key === 'Enter') done(input.value.trim()); };
      window._closePrompt = () => done(null);
    });
  }
  function showConfirm(title) {
    return new Promise(resolve => {
      document.getElementById('confirmTitle').textContent = title;
      const ov = document.getElementById('confirmOverlay');
      ov.classList.add('show');
      const ok = document.getElementById('confirmOk');
      const done = (val) => { ov.classList.remove('show'); ok.onclick = null; resolve(val); };
      ok.onclick = () => done(true);
      window._closeConfirm = () => done(false);
    });
  }

  function isPlainLabel(label) { return !/[0-9]/.test(label); }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  function render() {
    if (data.activeTab >= data.tabs.length) data.activeTab = Math.max(0, data.tabs.length - 1);
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    data.tabs.forEach((t, i) => {
      const b = document.createElement('button');
      b.className = 'tab' + (i === data.activeTab ? ' active' : '');
      b.textContent = t.name;
      b.onclick = () => { data.activeTab = i; save(); render(); };
      tabsEl.appendChild(b);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'tab-add'; addBtn.textContent = '+'; addBtn.title = '日を追加';
    addBtn.onclick = addTab; tabsEl.appendChild(addBtn);

    const area = document.getElementById('panelArea');
    area.innerHTML = '';
    if (data.tabs.length === 0) { area.innerHTML = '<div class="panel"><p class="hint">「+」で日を追加してください。</p></div>'; return; }
    const tab = data.tabs[data.activeTab];
    const panel = document.createElement('div'); panel.className = 'panel';
    const head = document.createElement('div'); head.className = 'panel-head';
    head.innerHTML = `<span class="day-name">${escapeHtml(tab.name)}</span>
      <span class="day-actions"><button id="renameBtn">名前変更</button><button id="delTabBtn">日を削除</button></span>`;
    panel.appendChild(head);

    tab.items.forEach((item, idx) => {
      const row = document.createElement('div'); row.className = 'item';
      row.innerHTML = `
        <div class="label ${isPlainLabel(item.label) ? 'plain' : ''}">${escapeHtml(item.label)}</div>
        <div class="content">${escapeHtml(item.content)}</div>
        <div class="row-actions">
          <button data-act="up">▲</button>
          <button data-act="down">▼</button>
          <button data-act="edit">✎</button>
          <button data-act="del">✕</button>
        </div>`;
      const btns = row.querySelectorAll('.row-actions button');
      btns[0].onclick = () => moveItem(idx, -1);
      btns[1].onclick = () => moveItem(idx, 1);
      btns[2].onclick = () => openEdit(idx);
      btns[3].onclick = () => deleteItem(idx);
      panel.appendChild(row);
    });

    const addWrap = document.createElement('div'); addWrap.className = 'add-item';
    addWrap.innerHTML = `<input class="label-in" id="newLabel" placeholder="ラベル">
      <input class="content-in" id="newContent" placeholder="内容を入力して追加">
      <button id="addBtn">追加</button>`;
    panel.appendChild(addWrap);
    area.appendChild(panel);

    document.getElementById('renameBtn').onclick = renameTab;
    document.getElementById('delTabBtn').onclick = deleteTab;
    document.getElementById('addBtn').onclick = addItem;
    const ci = document.getElementById('newContent');
    if (ci) ci.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
  }

  function addItem() {
    const label = document.getElementById('newLabel').value.trim() || '予定';
    const content = document.getElementById('newContent').value.trim();
    if (!content) return;
    data.tabs[data.activeTab].items.push({ label, content });
    save(); render();
  }
  function deleteItem(idx) { data.tabs[data.activeTab].items.splice(idx, 1); save(); render(); }
  function moveItem(idx, dir) {
    const items = data.tabs[data.activeTab].items; const ni = idx + dir;
    if (ni < 0 || ni >= items.length) return;
    [items[idx], items[ni]] = [items[ni], items[idx]]; save(); render();
  }

  let editingIdx = null;
  function openEdit(idx) {
    editingIdx = idx; const item = data.tabs[data.activeTab].items[idx];
    document.getElementById('editLabel').value = item.label;
    document.getElementById('editContent').value = item.content;
    document.getElementById('overlay').classList.add('show');
  }
  function closeModal() { document.getElementById('overlay').classList.remove('show'); editingIdx = null; }
  function saveModal() {
    if (editingIdx === null) return;
    const label = document.getElementById('editLabel').value.trim() || '予定';
    const content = document.getElementById('editContent').value.trim();
    if (!content) { closeModal(); return; }
    data.tabs[data.activeTab].items[editingIdx] = { label, content };
    save(); closeModal(); render();
  }

  async function addTab() {
    const name = await showPrompt('日を追加', '日の名前（例: 15日(土)）', '');
    if (name === null) return; const n = name.trim(); if (!n) return;
    data.tabs.push({ name: n, items: [] }); data.activeTab = data.tabs.length - 1; save(); render();
  }
  async function renameTab() {
    const cur = data.tabs[data.activeTab];
    const name = await showPrompt('名前変更', '日の名前', cur.name);
    if (name === null) return; const n = name.trim(); if (!n) return; cur.name = n; save(); render();
  }
  async function deleteTab() {
    const ok = await showConfirm(`「${data.tabs[data.activeTab].name}」を削除しますか？`);
    if (!ok) return;
    data.tabs.splice(data.activeTab, 1); if (data.activeTab > 0) data.activeTab--; save(); render();
  }
  async function resetData() {
    const ok = await showConfirm('すべての内容を初期状態に戻しますか？');
    if (!ok) return;
    data = JSON.parse(JSON.stringify(seedData)); save(); render(); toast('初期化しました');
  }

  document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
  document.getElementById('promptOverlay').addEventListener('click', e => { if (e.target.id === 'promptOverlay') window._closePrompt && window._closePrompt(); });
  document.getElementById('confirmOverlay').addEventListener('click', e => { if (e.target.id === 'confirmOverlay') window._closeConfirm && window._closeConfirm(); });

  // expose handlers used by inline onclick in HTML
  window.closeModal = closeModal;
  window.saveModal = saveModal;
  window.closePrompt = () => window._closePrompt && window._closePrompt();
  window.closeConfirm = () => window._closeConfirm && window._closeConfirm();
  window.resetData = resetData;

  render();
</script>
</body>
</html>
